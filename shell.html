  <style>
    body {
      font-family: arial;
      margin: 0;
      padding: none;
    }

    .emscripten {
      padding-right: 0;
      margin-left: auto;
      margin-right: auto;
      display: block;
    }

    div.emscripten {
      text-align: center;
    }

    div.emscripten_border {
      border: 0px solid black;
    }

    /* NOTE: Canvas *must not* have any border or padding, or mouse coords will be wrong */
    canvas.emscripten {
      border: 0px none;
      background: black;
    }

    .spinner {
      height: 30px;
      width: 30px;
      margin: 0;
      margin-top: 20px;
      margin-left: 20px;
      display: inline-block;
      vertical-align: top;
      -webkit-animation: rotation 0.8s linear infinite;
      -moz-animation: rotation 0.8s linear infinite;
      -o-animation: rotation 0.8s linear infinite;
      animation: rotation 0.8s linear infinite;
      border-left: 5px solid black;
      border-right: 5px solid black;
      border-bottom: 5px solid black;
      border-top: 5px solid red;
      border-radius: 100%;
      background-color: rgb(245, 245, 245);
    }

    @-webkit-keyframes rotation {
      from {
        -webkit-transform: rotate(0deg);
      }

      to {
        -webkit-transform: rotate(360deg);
      }
    }

    @-moz-keyframes rotation {
      from {
        -moz-transform: rotate(0deg);
      }

      to {
        -moz-transform: rotate(360deg);
      }
    }

    @-o-keyframes rotation {
      from {
        -o-transform: rotate(0deg);
      }

      to {
        -o-transform: rotate(360deg);
      }
    }

    @keyframes rotation {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    #status {
      display: inline-block;
      vertical-align: top;
      margin-top: 30px;
      margin-left: 20px;
      font-weight: bold;
      color: rgb(40, 40, 40);
    }

    #progress {
      height: 0px;
      width: 0px;
    }

    #controls {
      display: inline-block;
      position: fixed;
      top: 1em;
      right: 1em;
      width: fit-content;
    }

    input[type="button"] {
      background-color: lightgray;
      border: 4px solid darkgray;
      color: black;
      text-decoration: none;
      cursor: pointer;
      width: 140px;
      height: 50px;
      margin-left: 10px;
    }

    input[type="button"]:hover {
      background-color: #f5f5f5ff;
      border-color: black;
    }
  </style>

<body>
  <span id="controls">
    <div class="spinner" id='spinner'></div>
    <div class="emscripten" id="status">Downloading...</div>
    <span><input type="button" value="📜 SOURCE CODE"
        onclick="location.href='https://github.com/thng292/CrossyRoady';" /></span>
    <span><input type="button" value="🖵 FULLSCREEN" onclick="Module.requestFullscreen(false, false)" /></span>
    <span><input type="button" id="btn-audio" value="🔇 MUTE" onclick="toggleAudio()" /></span>
    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>
    </div>
  </span>
  <div class="emscripten_border">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>

  <script type="text/javascript">
    var statusElement = document.querySelector("#status");
    var progressElement = document.querySelector("#progress");
    var spinnerElement = document.querySelector("#spinner");
    var Module = {
      preRun: [],
      postRun: [],
      print: (function () {
        var element = document.querySelector("#output");

        if (element) element.value = ""; // Clear browser cache

        return function (text) {
          if (arguments.length > 1)
            text = Array.prototype.slice.call(arguments).join(" ");
          // These replacements are necessary if you render to raw HTML
          //text = text.replace(/&/g, "&amp;");
          //text = text.replace(/</g, "&lt;");
          //text = text.replace(/>/g, "&gt;");
          //text = text.replace('\n', '<br>', 'g');
          console.log(text);

          if (element) {
            element.value += text + "\n";
            element.scrollTop = element.scrollHeight; // focus on bottom
          }
        };
      })(),
      printErr: function (text) {
        if (arguments.length > 1)
          text = Array.prototype.slice.call(arguments).join(" ");

        console.error(text);
      },
      canvas: (function () {
        var canvas = document.querySelector("#canvas");

        // As a default initial behavior, pop up an alert when webgl context is lost.
        // To make your application robust, you may want to override this behavior before shipping!
        // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
        canvas.addEventListener(
          "webglcontextlost",
          function (e) {
            alert("WebGL context lost. You will need to reload the page.");
            e.preventDefault();
          },
          false
        );

        return canvas;
      })(),
      setStatus: function (text) {
        if (!Module.setStatus.last)
          Module.setStatus.last = { time: Date.now(), text: "" };
        if (text === Module.setStatus.last.text) return;

        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();

        if (m && now - Module.setStatus.last.time < 30) return; // If this is a progress update, skip it if too soon

        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;

        if (m) {
          text = m[1];
          progressElement.value = parseInt(m[2]) * 100;
          progressElement.max = parseInt(m[4]) * 100;
          progressElement.hidden = true;
          spinnerElement.hidden = false;
        } else {
          progressElement.value = null;
          progressElement.max = null;
          progressElement.hidden = true;
          if (!text) spinnerElement.style.display = "none";
        }

        statusElement.innerHTML = text;
      },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(
          left
            ? "Preparing... (" +
            (this.totalDependencies - left) +
            "/" +
            this.totalDependencies +
            ")"
            : "All downloads complete."
        );
      },
      //noInitialRun: true
    };

    Module.setStatus("Downloading...");

    window.onerror = function () {
      Module.setStatus("Exception thrown, see JavaScript console");
      spinnerElement.style.display = "none";
      Module.setStatus = function (text) {
        if (text) Module.printErr("[post-exception status] " + text);
      };
    };

    /* var canvas = document.querySelector('#canvas');

        if (canvas) {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight - 200;
        }
      }
      setCanvasSize();
      window.addEventListener("resize", setCanvasSize); */
  </script>

  <!-- REF: https://developers.google.com/web/updates/2018/11/web-audio-autoplay -->
  <script type="text/javascript">
    var audioBtn = document.querySelector("#btn-audio");

    // An array of all contexts to resume on the page
    const audioContexList = [];
    (function () {
      // A proxy object to intercept AudioContexts and
      // add them to the array for tracking and resuming later
      self.AudioContext = new Proxy(self.AudioContext, {
        construct(target, args) {
          const result = new target(...args);
          audioContexList.push(result);
          if (result.state == "suspended") audioBtn.value = "🔈 RESUME";
          return result;
        },
      });
    })();

    function toggleAudio() {
      var resumed = false;
      audioContexList.forEach((ctx) => {
        if (ctx.state == "suspended") {
          ctx.resume();
          resumed = true;
        } else if (ctx.state == "running") ctx.suspend();
      });

      if (resumed) audioBtn.value = "🔇 MUTE";
      else audioBtn.value = "🔈 RESUME";
    }
  </script>
